<style>
/* Layout: sticky title + filter bar over a card grid; sell form and item detail open as overlay panels */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #141b2d;
  --muted: #5b6679;
  --line: #d5dbe6;
  --accent: #2447d6;
  --accent-ink: #ffffff;
  --tag: #ffd23f;
  --tag-ink: #3a2e00;
  --ok: #1b7f4b;
  --warn: #b35a00;
  --danger: #c0322b;
  --soft: #e3e9f8;
  --font-display: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --surface: #181f35; --ink: #eaeef8; --muted: #9aa6bf; --line: #2b3553;
    --accent: #8aa0ff; --accent-ink: #0f1424; --tag: #ffd23f; --tag-ink: #3a2e00;
    --ok: #5fd39a; --warn: #f0a35a; --danger: #ff8078; --soft: #222c4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #181f35; --ink: #eaeef8; --muted: #9aa6bf; --line: #2b3553;
  --accent: #8aa0ff; --accent-ink: #0f1424; --tag: #ffd23f; --tag-ink: #3a2e00;
  --ok: #5fd39a; --warn: #f0a35a; --danger: #ff8078; --soft: #222c4c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top */
.top { padding-block: 28px 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.brand h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0; letter-spacing: 0; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 16px; cursor: pointer; font-weight: 500; min-height: 44px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }

/* filters */
.filters {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.frow { display: flex; flex-wrap: wrap; gap: 8px; }
.frow > * { min-width: 0; }
.field-s { flex: 1 1 160px; }
.ctl {
  width: 100%; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; min-height: 44px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { color: var(--muted); font-size: 14px; padding-block: 14px 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.notice { background: var(--soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-top: 12px; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0;
}
.card:hover { border-color: var(--accent); }
.card.sold { opacity: .6; }
.ph { position: relative; aspect-ratio: 4 / 3; background: var(--soft); display: grid; place-items: center; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .glyph { font-family: var(--font-display); font-size: 44px; color: var(--accent); opacity: .5; }
.price {
  position: absolute; left: 10px; bottom: 10px; background: var(--tag); color: var(--tag-ink);
  font-family: var(--font-display); font-weight: 500; padding: 2px 10px; border-radius: 6px; font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.status {
  position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 600;
  background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 8px;
}
.status.reserved { color: var(--warn); }
.status.sold { color: var(--muted); }
.cbody { padding: 12px 14px 14px; display: grid; gap: 4px; min-width: 0; }
.ctitle { font-weight: 600; overflow-wrap: anywhere; }
.cmeta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ai-badge { color: var(--accent); font-size: 12px; font-weight: 600; }

.empty { text-align: center; padding: 56px 16px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
.empty h2 { font-family: var(--font-display); font-weight: 500; margin: 0 0 6px; font-size: 22px; }
.empty p { margin: 0 auto 16px; color: var(--muted); max-width: 42ch; }

/* overlay */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 24, .55);
  display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
}
.panel {
  background: var(--surface); border-radius: 16px; width: 100%; max-width: 640px;
  padding: 20px; display: grid; gap: 14px; border: 1px solid var(--line);
}
.panel h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.f { display: grid; gap: 4px; min-width: 0; }
.f label { font-size: 13px; font-weight: 600; color: var(--muted); }
textarea.ctl { min-height: 96px; resize: vertical; }
.drop {
  border: 2px dashed var(--line); border-radius: 12px; min-height: 150px; display: grid; place-items: center;
  text-align: center; padding: 12px; cursor: pointer; background: var(--bg); overflow: hidden;
}
.drop img { max-height: 260px; max-width: 100%; border-radius: 8px; }
.drop span { color: var(--muted); }
.ai-box { background: var(--soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.ai-box p { margin: 0; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 1em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.dimg { width: 100%; max-height: 380px; object-fit: contain; background: var(--soft); border-radius: 12px; }
.dprice { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.contact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.contact code { font-family: var(--font-body); font-weight: 600; user-select: all; overflow-wrap: anywhere; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
@media (max-width: 520px) {
  .fgrid { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .price { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ตลาดหอ</h1>
      <p>ซื้อ ขาย แลกของมือสองกับเพื่อนในหอ ถ่ายรูปเดียว ให้ AI ช่วยเขียนประกาศและแนะนำราคา</p>
    </div>
    <button class="btn primary" id="open-sell" type="button">ลงขายของ</button>
  </header>

  <section class="filters" aria-label="ค้นหาและกรอง">
    <div class="frow">
      <div class="field-s" style="flex-basis:220px"><input class="ctl" id="q" type="search" placeholder="ค้นหาของ เช่น พัดลม, ชีท"></div>
      <div class="field-s"><select class="ctl" id="fb" aria-label="อาคาร"></select></div>
      <div class="field-s"><select class="ctl" id="ff" aria-label="ชั้น"></select></div>
    </div>
    <div class="chips" id="cats" role="group" aria-label="หมวดหมู่"></div>
  </section>

  <div class="count"><span id="count"></span><label><input type="checkbox" id="hide-sold" checked> ซ่อนที่ขายแล้ว</label></div>
  <div id="notice" class="notice" hidden></div>
  <main id="list" class="grid"></main>
  <div id="empty" class="empty" hidden></div>
</div>

<div id="sell" class="overlay" hidden>
  <form class="panel" id="sell-form" novalidate>
    <div class="phead"><h2>ลงขายของ</h2><button class="btn small" type="button" id="close-sell">ปิด</button></div>

    <div class="f">
      <label for="f-photo">รูปสินค้า</label>

      <input id="f-photo" type="file" accept="image/*" hidden>
    </div>

    <div class="ai-box" id="ai-box" hidden>
      <p><b>ให้ AI ช่วย</b> ดูรูปแล้วเขียนชื่อ คำอธิบาย และแนะนำช่วงราคาให้ แก้ไขได้ก่อนลงขาย</p>
      <div class="f"><label for="f-hint">ข้อมูลเพิ่มเติมให้ AI (ไม่บังคับ)</label>
        <input class="ctl" id="f-hint" placeholder="เช่น ซื้อมา 450 บาท ใช้มา 1 เทอม ใบพัดมีรอยเล็กน้อย"></div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn primary small" type="button" id="ai-go">ให้ AI ช่วยเขียน</button>
        <button class="btn small" type="button" id="ai-stop" hidden>หยุด</button>
      </div>
      <p id="ai-out" role="status"></p>
    </div>

    <div class="fgrid">
      <div class="f full"><label for="f-title">ชื่อสินค้า</label><input class="ctl" id="f-title" maxlength="80" placeholder="เช่น พัดลมตั้งโต๊ะ Hatari 12 นิ้ว"></div>
      <div class="f"><label for="f-cat">หมวดหมู่</label><select class="ctl" id="f-cat"></select></div>
      <div class="f"><label for="f-cond">สภาพ</label><select class="ctl" id="f-cond"></select></div>
      <div class="f full"><label for="f-desc">คำอธิบาย</label><textarea class="ctl" id="f-desc" maxlength="600"></textarea></div>
      <div class="f"><label for="f-price">ราคา (บาท)</label><input class="ctl" id="f-price" type="number" inputmode="numeric" min="0" step="1"></div>
      <div class="f"><label for="f-contact">LINE ID หรือเบอร์ติดต่อ</label><input class="ctl" id="f-contact" maxlength="60"></div>
      <div class="f"><label for="f-building">อาคาร</label><select class="ctl" id="f-building"></select></div>
      <div class="f"><label for="f-floor">ชั้น</label><select class="ctl" id="f-floor"></select></div>
    </div>
    <div class="err" id="sell-err" role="alert"></div>
    <div class="actions"><button class="btn" type="button" id="cancel-sell">ยกเลิก</button><button class="btn primary" type="submit" id="sell-submit">ลงขาย</button></div>
  </form>
</div>

<div id="detail" class="overlay" hidden>
  <div class="panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
</div>

<script>
(function () {
  "use strict";
  var BUILDINGS = ["อาคาร A", "อาคาร B", "อาคาร C", "อาคาร D"];
  var FLOORS = [1, 2, 3, 4, 5, 6, 7];
  var CATS = ["หนังสือ/ชีท", "เครื่องใช้ไฟฟ้า", "เฟอร์นิเจอร์", "เสื้อผ้า/ชุดนักศึกษา", "ของใช้ในห้อง", "อื่นๆ"];
  var CONDS = ["ใหม่มาก", "สภาพดี", "พอใช้", "มีตำหนิ"];
  var STATUS_TH = { available: "ว่าง", reserved: "จองแล้ว", sold: "ขายแล้ว" };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === "class") e.className = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else if (v !== false && v != null) e.setAttribute(k, v);

    for (var i = 2; i < arguments.length; i++) {

    }

  }
  var fmt = new Intl.NumberFormat("th-TH");

  function ago(ts) {

    if (s < 60) return "เมื่อกี้";
    if (s < 3600) return Math.round(s / 60) + " นาทีที่แล้ว";
    if (s < 86400) return Math.round(s / 3600) + " ชม.ที่แล้ว";

  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- state ---------- */
  var listings = [];
  var filt = { q: "", b: "", f: "", cat: "", hideSold: true };
  /* >>> ใส่ค่าจาก Supabase (Project Settings > API) ตรงนี้ 2 บรรทัด <<< */
  var SUPABASE_URL = "https://ksdmzzzdzpfpvjuhjwzb.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZG16enpkenBmcHZqdWhqd3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDA1NzksImV4cCI6MjEwNzIxNjU3OX0.huIuRcYwpO24swtNpGxmFd3sgHI-Rjjm9cvT754UE3k";
  var sb = null;          // supabase client when configured
  var meId = lsGet("dm-me") || ("g" + Math.random().toString(36).slice(2, 10));
  lsSet("dm-me", meId);
  var sampleFn = null, canImages = false;

  var aiMeta = false;     // listing text came from AI
  var aiCtl = null;

  /* ---------- storage layer (shared db, or in-memory fallback) ---------- */
  function addListing(obj) {
    if (sb) return sb.from("listings").insert(toRow(obj)).then(chk).then(loadListings);
    obj.id = "l" + Math.random().toString(36).slice(2, 9);
    listings.unshift(obj); render(); return Promise.resolve();
  }
  function patchListing(id, patch) {
    if (sb) return sb.from("listings").update(patch).eq("id", id).then(chk).then(loadListings);
    listings = listings.map(function (l) { return l.id === id ? Object.assign({}, l, patch) : l; });
    render(); return Promise.resolve();
  }
  function removeListing(id) {
    if (sb) return sb.from("listings").delete().eq("id", id).then(chk).then(loadListings);
    listings = listings.filter(function (l) { return l.id !== id; });
    render(); return Promise.resolve();
  }
  function chk(res) { if (res && res.error) throw res.error; return res; }
  function toRow(o) {
    return {
      title: o.title, category: o.category, condition: o.condition, description: o.description,
      price: o.price, building: o.building, floor: o.floor, contact: o.contact, photo: o.photo,
      status: o.status, ai: o.ai, seller_id: o.sellerId, created_at: o.createdAt
    };
  }
  function fromRow(r) {
    return {
      id: r.id, title: r.title, category: r.category, condition: r.condition, description: r.description || "",
      price: Number(r.price) || 0, building: r.building, floor: r.floor, contact: r.contact, photo: r.photo || "",
      status: r.status || "available", ai: !!r.ai, sellerId: r.seller_id, createdAt: Number(r.created_at) || 0

  }
  function loadListings() {
    return sb.from("listings").select("*").order("created_at", { ascending: false }).limit(100).then(function (res) {

  }

    try {

        .on("postgres_changes", { event: "*", schema: "public", table: "listings" }, function () { if (sb) loadListings().catch(function () {}); })

  }
  function note(t) { var n = $("#notice"); n.textContent = t; n.hidden = !t; }

  /* ---------- list ---------- */
  function visible() {
    var q = filt.q.trim().toLowerCase();
    var rows = listings.filter(function (l) {
      if (filt.hideSold && l.status === "sold") return false;
      if (filt.b && l.building !== filt.b) return false;
      if (filt.f && String(l.floor) !== filt.f) return false;

      if (q && (String(l.title) + " " + String(l.description || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    return rows.sort(function (a, b) {
      var sa = a.status === "sold" ? 1 : 0, sb = b.status === "sold" ? 1 : 0;

  }
  function photoBox(l) {
    var box = h("div", { class: "ph" });
    if (l.photo) box.append(h("img", { src: l.photo, alt: l.title, loading: "lazy" }));
    else box.append(h("span", { class: "glyph", "aria-hidden": "true" }, (l.category || "ข")[0]));
    return box;
  }
  function render() {
    var rows = visible(), list = $("#list"), empty = $("#empty");

    rows.forEach(function (l) {
      var ph = photoBox(l);
      ph.append(h("span", { class: "price" }, baht(l.price || 0)));
      if (l.status && l.status !== "available") ph.append(h("span", { class: "status " + l.status }, STATUS_TH[l.status]));
      var card = h("button", { class: "card" + (l.status === "sold" ? " sold" : ""), type: "button", onclick: function () { showDetail(l); } },

        h("div", { class: "cbody" },

          l.ai ? h("span", { class: "ai-badge" }, "ประกาศ AI ช่วยเขียน") : null));
      list.append(card);
    });
    $("#count").textContent = rows.length + " รายการ" + (rows.length !== listings.length ? " จากทั้งหมด " + listings.length : "");
    var none = rows.length === 0;

    if (none) {

      if (listings.length === 0) {
        empty.append(h("h2", null, "ยังไม่มีของวางขาย"),
          h("p", null, "เป็นคนแรกที่ลงขาย ถ่ายรูปของที่ไม่ใช้แล้ว ให้ AI ช่วยเขียนประกาศ แล้วเพื่อนในหอจะเห็นทันที"),
          h("button", { class: "btn primary", type: "button", onclick: openSell }, "ลงขายชิ้นแรก"));
      } else {
        empty.append(h("h2", null, "ไม่พบของที่ตรงกับตัวกรอง"), h("p", null, "ลองเปลี่ยนอาคาร ชั้น หรือหมวดหมู่"),
          h("button", { class: "btn", type: "button", onclick: resetFilters }, "ล้างตัวกรอง"));
      }
    }
  }
  function resetFilters() {
    filt.q = ""; filt.b = ""; filt.f = ""; filt.cat = "";
    $("#q").value = ""; $("#fb").value = ""; $("#ff").value = ""; renderChips(); render();
  }
  function renderChips() {
    var box = $("#cats"); box.textContent = "";
    ["ทั้งหมด"].concat(CATS).forEach(function (c, i) {
      var val = i === 0 ? "" : c;
      box.append(h("button", { class: "chip", type: "button", "aria-pressed": String(filt.cat === val), onclick: function () { filt.cat = val; renderChips(); render(); } }, c));
    });
  }

  /* ---------- detail ---------- */
  var openId = null;
  function showDetail(l) {
    openId = l.id;
    var p = $("#detail-panel"); p.textContent = "";
    var mine = l.sellerId === meId;
    var del = h("button", { class: "btn danger small", type: "button" }, "ลบประกาศ");
    del.addEventListener("click", function () {
      if (del.dataset.arm) { removeListing(l.id).then(closeDetail); return; }
      del.dataset.arm = "1"; del.textContent = "กดอีกครั้งเพื่อลบ";
    });
    var copyBtn = h("button", { class: "btn small", type: "button" }, "คัดลอก");
    copyBtn.addEventListener("click", function () {
      var done = function () { copyBtn.textContent = "คัดลอกแล้ว"; };
      try { navigator.clipboard.writeText(l.contact).then(done, function () { selectText(code); }); } catch (e) { selectText(code); }
    });
    var code = h("code", null, l.contact);
    function setStatus(s) { patchListing(l.id, { status: s }); }
    p.append(
      h("div", { class: "phead" }, h("h2", { id: "d-title" }, l.title), h("button", { class: "btn small", type: "button", onclick: closeDetail }, "ปิด")),
      l.photo ? h("img", { class: "dimg", src: l.photo, alt: l.title }) : null,
      h("div", { class: "dprice" }, baht(l.price || 0), " ", h("span", { class: "status " + (l.status || "available"), style: "position:static;font-size:13px;vertical-align:middle;border:1px solid var(--line)" }, STATUS_TH[l.status || "available"])),
      h("div", { class: "cmeta" }, h("span", null, l.category), h("span", null, "สภาพ: " + l.condition), h("span", null, l.building + " ชั้น " + l.floor), h("span", null, ago(l.createdAt || Date.now()))),
      l.description ? h("p", { class: "desc" }, l.description) : null,
      l.ai ? h("span", { class: "ai-badge" }, "ประกาศนี้ AI ช่วยเขียน ผู้ขายตรวจแก้แล้ว") : null,
      h("div", null, h("div", { class: "cmeta", style: "margin-bottom:6px" }, "ติดต่อผู้ขาย (นัดรับของที่หอ)"), h("div", { class: "contact" }, code, copyBtn)),
      mine ? h("div", { class: "actions", style: "justify-content:flex-start" },
        (l.status || "available") !== "reserved" ? h("button", { class: "btn small", type: "button", onclick: function () { setStatus("reserved"); } }, "ทำเครื่องหมายว่าจองแล้ว") : h("button", { class: "btn small", type: "button", onclick: function () { setStatus("available"); } }, "เปิดขายอีกครั้ง"),
        l.status !== "sold" ? h("button", { class: "btn small", type: "button", onclick: function () { setStatus("sold"); } }, "ขายแล้ว") : null,
        del) : null);
    $("#detail").hidden = false;
  }
  function selectText(el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  function closeDetail() { $("#detail").hidden = true; openId = null; }

  /* ---------- sell form ---------- */
  function openSell() { $("#sell").hidden = false; $("#sell-err").textContent = ""; }
  function closeSell() { $("#sell").hidden = true; if (aiCtl) aiCtl.abort(); }
  function resetForm() {
    $("#sell-form").reset(); photo = { blob: null, dataUrl: "" }; aiMeta = false;
    var d = $("#drop"); d.textContent = ""; d.append(h("span", { id: "drop-hint" }, "แตะเพื่อเลือกรูป (รูปเดียวพอ)"));
    $("#ai-out").textContent = "";
  }
  function shrink(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) {
          if (!blob) return reject(new Error("blob"));
          var fr = new FileReader();
          fr.onload = function () { resolve({ blob: blob, dataUrl: String(fr.result) }); };
          fr.onerror = reject; fr.readAsDataURL(blob);
        }, "image/jpeg", 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }
  function onPhoto(file) {
    if (!file) return;
    shrink(file, 560).then(function (r) {
      photo = r;
      var d = $("#drop"); d.textContent = ""; d.append(h("img", { src: r.dataUrl, alt: "รูปสินค้าที่เลือก" }));
    }).catch(function () { $("#sell-err").textContent = "เปิดรูปนี้ไม่ได้ ลองเลือกไฟล์ JPG หรือ PNG"; });
  }
  function aiErr(code) {
    var m = {
      not_granted: "ยังไม่ได้อนุญาตให้ใช้ AI ในหน้านี้ กรอกข้อมูลเองได้เลย",
      rate_limited: "ใช้ AI ถี่เกินไป รอสักครู่แล้วลองใหม่",
      image_rejected: "AI อ่านรูปนี้ไม่ได้ ลองเลือกรูปอื่น",
      invalid_json: "AI ตอบกลับมาไม่ครบ กดลองอีกครั้ง",
      session_expired: "เซสชันหมดอายุ ต้องเข้าสู่ระบบใหม่"
    };
    return m[code] || "ตอนนี้ใช้ AI ไม่ได้ กรอกข้อมูลเองได้เลย";
  }
  function pick(v, list, dflt) { return list.indexOf(v) >= 0 ? v : dflt; }
  function runAI() {
    if (!sampleFn) return;
    var title = $("#f-title").value.trim(), hint = $("#f-hint").value.trim();
    var useImg = canImages && photo.blob;
    var out = $("#ai-out");
    if (!useImg && !title && !hint) { out.textContent = "เลือกรูป หรือพิมพ์ชื่อสินค้าก่อน แล้วค่อยให้ AI ช่วย"; return; }
    var prompt =
      "คุณเป็นผู้ช่วยลงประกาศขายของมือสองระหว่างนักศึกษาในหอพักมหาวิทยาลัยไทย\n" +
      (useImg ? "ดูรูปสินค้าที่แนบมา " : "") + "และใช้ข้อมูลที่ผู้ขายให้ แล้วตอบเป็น JSON อย่างเดียว ไม่มีข้อความอื่น รูปแบบ:\n" +
      '{"title":"ชื่อสินค้าสั้นกระชับ","category":"หนึ่งในหมวดที่ให้","condition":"หนึ่งในสภาพที่ให้","description":"2-3 ประโยค ภาษาไทยเป็นกันเอง","price_suggest":0,"price_min":0,"price_max":0,"reason":"เหตุผลเรื่องราคา 1 ประโยค"}\n' +
      "หมวดที่ให้: " + CATS.join(", ") + "\nสภาพที่ให้: " + CONDS.join(", ") + "\n" +
      "กติกา: คำอธิบายบอกเฉพาะสิ่งที่เห็นในรูปหรือผู้ขายบอก ห้ามแต่งสเปกหรือยี่ห้อที่ไม่แน่ใจ ราคาเป็นบาท จำนวนเต็ม เหมาะกับกระเป๋านักศึกษา โดยทั่วไปมือสองในหอประมาณ 30-60% ของราคาซื้อใหม่\n" +
      "ข้อมูลจากผู้ขาย: ชื่อที่พิมพ์ = " + (title || "(ไม่มี)") + " ; รายละเอียดเพิ่ม = " + (hint || "(ไม่มี)");
    var go = $("#ai-go"), stop = $("#ai-stop");
    aiCtl = new AbortController();
    go.disabled = true; stop.hidden = false; out.textContent = "AI กำลังดูรูปและเขียนประกาศ...";
    var o = { modelTier: "quick", signal: aiCtl.signal };
    if (useImg) o.images = photo.blob;
    sampleFn.json(prompt, o).then(function (r) {
      if (!r || typeof r !== "object") throw { code: "invalid_json" };
      if (r.title) $("#f-title").value = String(r.title).slice(0, 80);
      $("#f-cat").value = pick(r.category, CATS, "อื่นๆ");
      $("#f-cond").value = pick(r.condition, CONDS, "สภาพดี");
      if (r.description) $("#f-desc").value = String(r.description).slice(0, 600);
      var ps = Math.round(Number(r.price_suggest)), lo = Math.round(Number(r.price_min)), hi = Math.round(Number(r.price_max));
      if (ps > 0) $("#f-price").value = ps;
      aiMeta = true;
      out.textContent = (lo > 0 && hi > 0 ? "ช่วงราคาแนะนำ " + baht(lo) + " – " + baht(hi) + ". " : "") + (r.reason ? String(r.reason) : "") + " ตรวจและแก้ได้ก่อนลงขาย";
    }).catch(function (e) {
      out.textContent = e && e.code === "cancelled" ? "" : aiErr(e && e.code);
    }).then(function () { go.disabled = false; stop.hidden = true; aiCtl = null; });
  }
  function submitSell(ev) {
    ev.preventDefault();
    var err = $("#sell-err"), v = function (id) { return $(id).value.trim(); };
    var price = Math.round(Number(v("#f-price")));
    if (!v("#f-title")) return void (err.textContent = "ใส่ชื่อสินค้าก่อน");
    if (!(price >= 0) || v("#f-price") === "") return void (err.textContent = "ใส่ราคาเป็นตัวเลข (0 = ให้ฟรี)");
    if (!v("#f-building") || !v("#f-floor")) return void (err.textContent = "เลือกอาคารและชั้นที่นัดรับของ");
    if (!v("#f-contact")) return void (err.textContent = "ใส่ LINE ID หรือเบอร์ให้คนติดต่อได้");
    err.textContent = "";
    var btn = $("#sell-submit"); btn.disabled = true;
    addListing({
      title: v("#f-title"), category: $("#f-cat").value, condition: $("#f-cond").value,
      description: v("#f-desc"), price: price, building: $("#f-building").value, floor: Number($("#f-floor").value),
      contact: v("#f-contact"), photo: photo.dataUrl, status: "available", ai: aiMeta,
      sellerId: meId, createdAt: Date.now()
    }).then(function () { resetForm(); closeSell(); }).catch(function (e) {
      err.textContent = e && e.code === "quota_exceeded" ? "พื้นที่เก็บข้อมูลเต็ม ลบประกาศเก่าก่อน" : "บันทึกไม่สำเร็จ ลองอีกครั้ง";
    }).then(function () { btn.disabled = false; });
  }

  /* ---------- wire up ---------- */
  opts($("#fb"), BUILDINGS, "ทุกอาคาร"); opts($("#ff"), FLOORS, "ทุกชั้น");
  opts($("#f-cat"), CATS); opts($("#f-cond"), CONDS, null); $("#f-cond").value = "สภาพดี";
  opts($("#f-building"), BUILDINGS, "เลือกอาคาร"); opts($("#f-floor"), FLOORS, "เลือกชั้น");
  renderChips(); render();
  $("#q").addEventListener("input", function (e) { filt.q = e.target.value; render(); });
  $("#fb").addEventListener("change", function (e) { filt.b = e.target.value; render(); });
  $("#ff").addEventListener("change", function (e) { filt.f = e.target.value; render(); });
  $("#hide-sold").addEventListener("change", function (e) { filt.hideSold = e.target.checked; render(); });
  $("#open-sell").addEventListener("click", openSell);
  $("#close-sell").addEventListener("click", closeSell);
  $("#cancel-sell").addEventListener("click", closeSell);
  $("#sell-form").addEventListener("submit", submitSell);
  $("#drop").addEventListener("click", function () { $("#f-photo").click(); });
  $("#f-photo").addEventListener("change", function (e) { onPhoto(e.target.files[0]); });
  $("#ai-go").addEventListener("click", runAI);
  $("#ai-stop").addEventListener("click", function () { if (aiCtl) aiCtl.abort(); });
  $("#detail").addEventListener("click", function (e) { if (e.target === $("#detail")) closeDetail(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!$("#detail").hidden) closeDetail(); else if (!$("#sell").hidden) closeSell(); } });

  try {
    if (window.supabase && SUPABASE_URL.indexOf("YOUR_") < 0 && SUPABASE_KEY.indexOf("YOUR_") < 0) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch (e) { sb = null; }
  if (sb) subscribe();
  else note("ยังไม่ได้ตั้งค่าฐานข้อมูล ของที่ลงจะอยู่เฉพาะในหน้านี้ และจะหายเมื่อรีเฟรช");

  var c = window.claude && window.claude.use ? window.claude : null;
  if (c) {
    c.use("user").then(function (u) { if (u && u.id) return u.id().then(function (id) { if (id) meId = String(id); }); }).catch(function () {});
    c.use("sample").then(function (s) {
      if (!s) return;
      sampleFn = s; $("#ai-box").hidden = false;
      return s.limits().then(function (l) { canImages = !!(l && l.images); }).catch(function () {});
    }).catch(function () {});
  }
})();
</script>
